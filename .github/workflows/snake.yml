name: Generate Snake Animation

on:
  schedule:
    # Runs every 24 hours
    - cron: "0 0 * * *"
  
  # Allows manual execution anytime from the Actions tab
  workflow_dispatch:

  # Runs automatically when you push to main
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
            github_user_name: "KrishAFK"
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFFD37&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=orange&color_dots=#CBCBCB,#0e4429,#006d32,#26a641,#39d353

      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
